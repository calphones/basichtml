# Interior AI System — Runtime Configuration

blender:
  executable: "/usr/bin/blender"           # override with BLENDER_PATH env var
  background_flag: "--background"
  python_flag: "--python"
  render_engine_preview: "BLENDER_EEVEE"
  render_engine_final: "CYCLES"
  cycles_device: "GPU"                     # GPU | CPU
  cycles_samples_preview: 64
  cycles_samples_final: 512
  eevee_samples: 16

paths:
  assets_root: "./assets"
  furniture_models: "./assets/furniture"
  hdri_maps: "./assets/hdri"
  textures: "./assets/textures"
  output_renders: "./output/renders"
  output_scenes: "./output/scenes"
  temp: "/tmp/interior_ai"

cv:
  wall_detection_model: "deeplab_v3"
  depth_model: "depth_anything_v2"         # local ONNX checkpoint
  depth_model_path: "./models/depth_anything_v2.onnx"
  sam2_checkpoint: "./models/sam2_hiera_large.pt"
  ocr_engine: "tesseract"                  # tesseract | paddleocr
  min_wall_length_px: 20
  wall_thickness_range_px: [3, 40]
  door_arc_detection: true
  stair_pattern_threshold: 0.7

design:
  default_style: "modern_organic"
  default_ceiling_height_m: 2.74           # 9 ft typical US townhome
  min_circulation_width_m: 0.91            # 36 inches ADA-friendly
  sofa_to_tv_distance_range_m: [2.1, 3.7]
  dining_chair_clearance_m: 0.9
  bed_side_clearance_m: 0.6
  furniture_wall_gap_m: 0.05

materials:
  default_floor: "light_oak_hardwood"
  default_wall_paint: "warm_white"
  wood_tones:
    - light_oak
    - white_oak
    - walnut
    - natural_maple
  metals:
    - brushed_brass
    - matte_black
    - brushed_nickel

lighting:
  default_color_temp_k: 2700               # warm white
  accent_color_temp_k: 3000
  daylight_color_temp_k: 5500
  hdri_default: "venice_sunset_4k.hdr"
  recessed_spacing_m: 1.5
  pendant_height_above_table_m: 0.7

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
  max_upload_size_mb: 100
  session_timeout_minutes: 60

performance:
  target_preview_seconds: 30
  target_final_render_minutes: 20
  max_parallel_renders: 2
  gpu_memory_limit_gb: 8
